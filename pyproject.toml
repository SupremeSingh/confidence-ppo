[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-ppo"
version = "0.1.0"
description = "Isolated prompt-style actor-critic PPO study"
requires-python = ">=3.10"
dependencies = ["datasets", "pyarrow", "huggingface-hub", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
